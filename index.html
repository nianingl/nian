<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>nian的传讯站</title>
    <style>
        /* 基础重置 */
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, sans-serif; background: #f4f6f9; height: 100vh; overflow: hidden; color: #333; }

        /* 顶部状态栏 */
        .status-bar { height: 40px; display: flex; justify-content: space-between; align-items: center; padding: 0 20px; font-size: 14px; font-weight: bold; color: #555; position: absolute; top: 0; width: 100%; z-index: 10; }

        /* 页面容器：所有页面都在这里，通过隐藏/显示切换 */
        .screen { 
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; 
            background: linear-gradient(135deg, #fdfbfb 0%, #ebedee 100%);
            display: none; /* 默认隐藏所有页面 */
            flex-direction: column;
            padding-top: 40px; /* 留出状态栏位置 */
        }
        .screen.active { display: flex; } /* 激活的页面显示出来 */

        /* 桌面样式 */
        .header-widget { padding: 20px; background: white; border-radius: 0 0 30px 30px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); margin-bottom: 20px; }
        .header-widget h1 { font-size: 22px; color: #ff9a9e; margin-bottom: 5px; }
        .app-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px 10px; padding: 20px; overflow-y: auto; }
        .app { display: flex; flex-direction: column; align-items: center; cursor: pointer; }
        .app-icon { width: 60px; height: 60px; border-radius: 15px; background: white; box-shadow: 0 4px 10px rgba(0,0,0,0.08); display: flex; justify-content: center; align-items: center; font-size: 30px; margin-bottom: 8px; }
        .app-name { font-size: 12px; color: #444; }

        /* 内部软件页面通用样式 */
        .app-header { display: flex; align-items: center; padding: 10px 15px; background: white; border-bottom: 1px solid #eee; }
        .back-btn { font-size: 16px; color: #ff9a9e; cursor: pointer; padding: 5px 10px; font-weight: bold; }
        .app-title { font-size: 16px; font-weight: bold; flex: 1; text-align: center; margin-right: 40px; }
        .app-content { flex: 1; padding: 15px; overflow-y: auto; }

        /* 聊天界面样式 */
        .chat-box { display: flex; flex-direction: column; gap: 10px; padding-bottom: 20px; }
        .message { max-width: 80%; padding: 10px; border-radius: 10px; font-size: 14px; line-height: 1.4; }
        .message.me { background: #ff9a9e; color: white; align-self: flex-end; border-bottom-right-radius: 0; }
        .message.dream { background: white; align-self: flex-start; border-bottom-left-radius: 0; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .chat-input-area { display: flex; gap: 10px; padding: 10px; background: white; border-top: 1px solid #eee; }
        .chat-input-area input { flex: 1; padding: 10px; border: 1px solid #ddd; border-radius: 20px; outline: none; }
        .chat-input-area button { background: #ff9a9e; color: white; border: none; padding: 0 20px; border-radius: 20px; font-weight: bold; }

        /* 字卡界面样式 */
        .card-list { display: flex; flex-direction: column; gap: 10px; }
        .card-item { background: white; padding: 15px; border-radius: 10px; display: flex; justify-content: space-between; box-shadow: 0 2px 5px rgba(0,0,0,0.05); font-size: 14px;}
        .card-delete { color: #ff4d4f; cursor: pointer; }
        .add-card-area { display: flex; gap: 10px; margin-top: 20px; }
        .add-card-area input { flex: 1; padding: 10px; border: 1px solid #ddd; border-radius: 5px; }

        /* 设置界面样式 */
        .settings-group { background: white; padding: 15px; border-radius: 10px; margin-bottom: 15px; }
        .settings-item { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        .settings-item input { padding: 8px; border: 1px solid #ddd; border-radius: 5px; width: 60%; }
    </style>
</head>
<body>

    <!-- 状态栏 -->
    <div class="status-bar">
        <span id="clock">12:00</span>
        <span>📶 🔋 100%</span>
    </div>

    <!-- ================= 1. 桌面主页 ================= -->
    <div id="screen-home" class="screen active">
        <div class="header-widget">
            <h1 id="home-title">nian 的传讯站</h1>
            <p>欢迎回来，今天想聊点什么？</p>
        </div>
        <div class="app-grid">
            <!-- 只有带有 onclick="openApp('xxx')" 的才能点进去 -->
            <div class="app" onclick="openApp('chat')"><div class="app-icon">💬</div><div class="app-name">聊天</div></div>
            <div class="app" onclick="openApp('cards')"><div class="app-icon">🗂️</div><div class="app-name">字卡</div></div>
            <div class="app" onclick="openApp('settings')"><div class="app-icon">⚙️</div><div class="app-name">设置</div></div>
            
            <!-- 下面这些还没有做，点了会提示 -->
            <div class="app" onclick="alert('这个软件还在开发中哦！')"><div class="app-icon">👥</div><div class="app-name">群聊</div></div>
            <div class="app" onclick="alert('这个软件还在开发中哦！')"><div class="app-icon">🎵</div><div class="app-name">音乐</div></div>
            <div class="app" onclick="alert('这个软件还在开发中哦！')"><div class="app-icon">✉️</div><div class="app-name">信箱</div></div>
        </div>
    </div>

    <!-- ================= 2. 聊天软件 ================= -->
    <div id="screen-chat" class="screen">
        <div class="app-header">
            <div class="back-btn" onclick="closeApp()">〈 返回</div>
            <div class="app-title" id="chat-title">与梦角的聊天</div>
        </div>
        <div class="app-content" id="chat-content">
            <div class="chat-box" id="chat-box">
                <!-- 聊天记录会显示在这里 -->
            </div>
        </div>
        <div class="chat-input-area">
            <input type="text" id="msg-input" placeholder="输入消息...">
            <button onclick="sendMsg()">发送</button>
        </div>
    </div>

    <!-- ================= 3. 字卡软件 ================= -->
    <div id="screen-cards" class="screen">
        <div class="app-header">
            <div class="back-btn" onclick="closeApp()">〈 返回</div>
            <div class="app-title">我的字卡库</div>
        </div>
        <div class="app-content">
            <div class="card-list" id="card-list">
                <!-- 字卡列表会显示在这里 -->
            </div>
            <div class="add-card-area">
                <input type="text" id="new-card-input" placeholder="添加新字卡...">
                <button onclick="addCard()" style="background:#ff9a9e; color:white; border:none; border-radius:5px; padding:0 15px;">添加</button>
            </div>
        </div>
    </div>

    <!-- ================= 4. 设置软件 ================= -->
    <div id="screen-settings" class="screen">
        <div class="app-header">
            <div class="back-btn" onclick="closeApp()">〈 返回</div>
            <div class="app-title">设置</div>
        </div>
        <div class="app-content">
            <div class="settings-group">
                <div class="settings-item">
                    <label>梦角昵称：</label>
                    <input type="text" id="setting-dream-name" value="梦角">
                </div>
                <div class="settings-item">
                    <label>我的昵称：</label>
                    <input type="text" id="setting-my-name" value="我">
                </div>
                <button onclick="saveSettings()" style="width:100%; padding:10px; background:#ff9a9e; color:white; border:none; border-radius:5px; margin-top:10px;">保存设置</button>
            </div>
            <p style="text-align:center; font-size:12px; color:#999;">数据保存在你的浏览器本地，不会丢失。</p>
        </div>
    </div>

    <script>
        // ====== 1. 页面切换逻辑 ======
        function openApp(appName) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById('screen-' + appName).classList.add('active');
            
            // 如果打开的是聊天，更新聊天标题
            if(appName === 'chat') {
                document.getElementById('chat-title').innerText = `与 ${dreamName} 的聊天`;
            }
        }

        function closeApp() {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById('screen-home').classList.add('active');
        }

        // ====== 2. 时钟 ======
        setInterval(() => {
            const now = new Date();
            document.getElementById('clock').innerText = now.getHours().toString().padStart(2, '0') + ':' + now.getMinutes().toString().padStart(2, '0');
        }, 1000);

        // ====== 3. 全局变量与数据存储 ======
        let dreamName = localStorage.getItem('dreamName') || 'Nina';
        let myName = localStorage.getItem('myName') || '我';
        let chatHistory = JSON.parse(localStorage.getItem('chatHistory')) || [];
        let cards = JSON.parse(localStorage.getItem('cards')) || ['早安呀！', '今天天气真不错。', '你在干嘛呢？', '我有点想你了。'];

        // 初始化数据
        function initData() {
            document.getElementById('home-title').innerText = `${dreamName} 的传讯站`;
            document.getElementById('setting-dream-name').value = dreamName;
            document.getElementById('setting-my-name').value = myName;
            renderChat();
            renderCards();
        }

        // ====== 4. 聊天功能 ======
        function renderChat() {
            const chatBox = document.getElementById('chat-box');
            chatBox.innerHTML = '';
            chatHistory.forEach(msg => {
                const div = document.createElement('div');
                div.className = `message ${msg.type}`;
                div.innerText = msg.text;
                chatBox.appendChild(div);
            });
            // 滚动到底部
            const content = document.getElementById('chat-content');
            content.scrollTop = content.scrollHeight;
        }

        function sendMsg() {
            const input = document.getElementById('msg-input');
            const text = input.value.trim();
            if(!text) return;

            // 添加我的消息
            chatHistory.push({ type: 'me', text: text });
            input.value = '';
            renderChat();

            // 梦角回复 (延迟1秒)
            setTimeout(() => {
                // 从字卡里随机挑一句回复
                const reply = cards[Math.floor(Math.random() * cards.length)];
                chatHistory.push({ type: 'dream', text: reply });
                renderChat();
                saveToLocal();
            }, 1000);
        }

        // ====== 5. 字卡功能 ======
        function renderCards() {
            const list = document.getElementById('card-list');
            list.innerHTML = '';
            cards.forEach((card, index) => {
                const div = document.createElement('div');
                div.className = 'card-item';
                div.innerHTML = `<span>${card}</span><span class="card-delete" onclick="deleteCard(${index})">删除</span>`;
                list.appendChild(div);
            });
        }

        function addCard() {
            const input = document.getElementById('new-card-input');
            const text = input.value.trim();
            if(!text) return;
            cards.push(text);
            input.value = '';
            renderCards();
            saveToLocal();
        }

        function deleteCard(index) {
            cards.splice(index, 1);
            renderCards();
            saveToLocal();
        }

        // ====== 6. 设置功能 ======
        function saveSettings() {
            dreamName = document.getElementById('setting-dream-name').value || 'Nina';
            myName = document.getElementById('setting-my-name').value || '我';
            
            document.getElementById('home-title').innerText = `${dreamName} 的传讯站`;
            saveToLocal();
            alert('保存成功！');
        }

        // ====== 7. 保存到浏览器 ======
        function saveToLocal() {
            localStorage.setItem('dreamName', dreamName);
            localStorage.setItem('myName', myName);
            localStorage.setItem('chatHistory', JSON.stringify(chatHistory));
            localStorage.setItem('cards', JSON.stringify(cards));
        }

        // 启动时加载数据
        initData();
    </script>
</body>
</html>
